<script src="site.js"></script>
<script>
    const clock = document.getElementById('clock');
    const locale = () => ({ nl: 'nl-NL', en: 'en-GB', tr: 'tr-TR' })[document.documentElement.lang] || 'en-GB';
    const tick = () => {
        const now = new Date(), hr = now.getHours();
        const greet = t(hr < 6 ? 'search.night' : hr < 12 ? 'search.morning' : hr < 18 ? 'search.afternoon' : 'search.evening');
        clock.textContent = `${greet} · ${now.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })} · ${now.toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' })}`;
    };
    tick();
    setInterval(tick, 10000);
    document.addEventListener('langchange', tick);
    const q = document.getElementById('q');
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    });
</script>
